name: Build distributions

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - name: Install test and build tools
        run: python -m pip install '.[dev]' build twine
      - name: Verify tag version
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              assert os.environ['GITHUB_REF_NAME'] == f'v{version}'
          PY
      - name: Test
        run: python -m pytest -q
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel, = Path('dist').glob('*.whl')
          with ZipFile(wheel) as archive:
              names = archive.namelist()
              for suffix in ('python_panels/houdini_agent.pypanel',
                             'python3.11libs/uiready.py', 'python3.13libs/uiready.py'):
                  assert any(name.endswith(suffix) for name in names), suffix
          assert len(list(Path('dist').glob('*.tar.gz'))) == 1
          PY
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
